<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мортимер — суставная анимация</title><link rel="stylesheet" href="../animation-lab/style.css"><link rel="stylesheet" href="../shared/mortimer-rig.css"><style>
body{background:#0b1116}main{max-width:1200px}.preview{position:relative;height:780px;background:radial-gradient(ellipse at 43% 65%,#243027,#101820 65%);overflow:hidden;border:1px solid #495341;border-radius:12px}.preview .mortimer-actor{height:730px;width:487px;left:13%;bottom:35px;aspect-ratio:2/3}.preview .mortimer-ground{bottom:-9%;opacity:.7}.caption{position:absolute;left:64%;top:32%;right:30px;color:#d3dabb;font:22px Georgia,serif}.caption small{display:block;font:13px system-ui,sans-serif;color:#9cae9d;line-height:1.7;margin-top:20px}.toolbar{padding-top:20px}.toolbar button{font-size:13px}h1{font:24px Georgia,serif;color:#dfd0a7} @media(max-width:650px){.preview{height:650px}.preview .mortimer-actor{width:380px;height:570px;left:calc(50% - 190px);bottom:40px}.caption{left:12px;right:12px;top:15px;font-size:17px;text-align:center}.caption small{display:none}}
</style></head><body><main><h1>Мортимер · послойная анимация</h1><section class="preview"><div class="mortimer-actor" data-pose="idle"><img class="mortimer-ground" src="../../assets/runtime/environment/ground_mortimer.png" alt=""><span class="mortimer-contact"></span><span class="mortimer" role="img" aria-label="Мортимер"></span></div><div class="caption"><span id="caption">Спокойное ожидание</span><small>Один персонаж, подвижные суставы.<br>Опора ступней и лопаты закреплена.</small></div></section><div class="toolbar"><button data-cue="idle">Ожидание</button><button data-cue="lantern">Поднять фонарь</button><button data-cue="look">Посмотреть на ×10</button><button data-cue="hat">Коснуться шляпы</button><button data-cue="acknowledge">Небольшой выигрыш</button><label><input type="checkbox" id="reduced"> Меньше движения</label></div><script type="module">
import{createMortimerRig}from'../shared/mortimer-rig.mjs';
document.querySelector('#reduced').checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
const actor=document.querySelector('.mortimer-actor'),rig=createMortimerRig(actor,{motionFactor:()=>document.querySelector('#reduced').checked?0:1});await rig.preload();window.mortimerLab={rig};
const labels={idle:'Спокойное ожидание',lantern:'Фонарь · подготовка, подъём, возврат',look:'Взгляд на усиление ×10',hat:'Касание шляпы при крупном выигрыше',acknowledge:'Сдержанная реакция на небольшую выплату'};
document.querySelectorAll('[data-cue]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#caption').textContent=labels[b.dataset.cue];if(b.dataset.cue==='idle')rig.restore();else rig.trigger(b.dataset.cue);}));
</script></main></body></html>
