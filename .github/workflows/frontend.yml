name: Frontend verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python tools/setup_sdk.py
      - run: python tools/export_frontend_content.py
      - run: python tools/export_demo_rounds.py
      - run: git diff --exit-code -- web/game/rules.json web/game/demo-rounds.json
      - run: node --test tests/web/*.test.mjs
      - run: npm install --prefix .cache/browser-qa --no-save --package-lock=false playwright@1.62.1
      - name: Use the browser installed on the GitHub runner
        run: |
          game_browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$game_browser"
          printf 'GAME_BROWSER_PATH=%s\n' "$game_browser" >> "$GITHUB_ENV"
      - run: NODE_PATH="$PWD/.cache/browser-qa/node_modules" node tools/verify_game_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midnight-plots-frontend-checks
          path: |
            .cache/frontend-browser.json
            .cache/frontend-screenshots/
